# Held-out trip templates for the E1–E4 experiments (pre-registration R11, as decided 2026-11-01).
#
# Written before any experiment, and never run by any strategy until the pre-registration is frozen.
# The 10 templates in eval/scenarios/trips.yaml are the dev set (they were explored in Phases 3 and 5).
# Budgets were set from the trip's length, party size and style, not from any planning run.
# Every city is covered by the recorded/mock providers, so the experiments run offline.

